name: refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, offset so it isn't fighting the whole planet
  workflow_dispatch:          # manual button in the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: install deps
        working-directory: .github/scripts
        run: npm ci

      - name: generate ascii blocks
        env:
          # PAT with read:user scope, so private contributions are counted.
          # Falls back to the built-in token, which only sees public data.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          README_PATH: ${{ github.workspace }}/README.md
        working-directory: .github/scripts
        run: node update_profile.mjs

      - name: commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "nothing changed, going back to sleep"
            exit 0
          fi
          git commit -m "chore: refresh profile stats [skip ci]"
          git push
